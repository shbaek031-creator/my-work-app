<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>방송별 주문 건수</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <h1>방송별 주문 건수</h1>

    <label class="filter">
      월
      <select id="month-select">
        <option value="">전체</option>
      </select>
    </label>

    <section class="cards" aria-label="요약">
      <div class="card">
        <p class="card-label">방송 건수</p>
        <p class="card-value" id="card-count">-</p>
      </div>
      <div class="card">
        <p class="card-label">주문 합계</p>
        <p class="card-value" id="card-total">-</p>
      </div>
    </section>

    <p class="status" id="status" role="status"></p>

    <div class="table-wrap">
      <table class="order-table">
        <thead>
          <tr>
            <th scope="col">방송일</th>
            <th scope="col">방송 이름</th>
            <th scope="col" class="num">주문 건수</th>
          </tr>
        </thead>
        <tbody id="order-body"></tbody>
      </table>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
